<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nature Slider</title>
  <link rel="stylesheet" href="./assets/css/normalize.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link type="image/png" sizes="16x16" rel="icon" href="./assets/favicon/favicon-16.png">
  <link type="image/png" sizes="32x32" rel="icon" href="./assets/favicon/favicon-32.png">
 </head>
<body>
  <div class="wrapper">
    <div class="slider-wrapper">
      <input type="radio" id="radio_4" name="but" />
      <input type="radio" id="radio_3" name="but" />
      <input type="radio" id="radio_2" name="but" />
      <input type="radio" id="radio_1" name="but" checked/>
      <div class="slider-button">
        <label for="radio_1" class="lableRadio" id="radio1">
          <span>&#9679;</span>
        </label>
        <label for="radio_2" class="lableRadio" id="radio2">
          <span>&#9679;</span>
        </label>
        <label for="radio_3" class="lableRadio" id="radio3">
          <span>&#9679;</span>
        </label>
        <label for="radio_4" class="lableRadio" id="radio4">
          <span>&#9679;</span>
        </label>
      </div>
      <div class="slider-description">
          <h2 class="txt1">Idaho Mountain River</h2>
          <h2 class="txt2">Alabama Mountain River</h2>
          <h2 class="txt3">Alaska Mountain River</h2>
          <h2 class="txt4">Oklahoma Mountain River</h2>
      </div>
      <div class="slider">
        <div class="slider-img">
          <img src="./assets/img/img_1.jpg" alt="Img1">
          <img src="./assets/img/img_2.jpg" alt="Img2">
          <img src="./assets/img/img_3.jpg" alt="Img3">
          <img src="./assets/img/img_4.jpg" alt="Img4">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
